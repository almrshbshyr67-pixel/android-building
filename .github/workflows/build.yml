
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Web App Artifact
        run: mkdir -p dist && cp index.html dist/
      - name: Upload APK Ready Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: dist/
